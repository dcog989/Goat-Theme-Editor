name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just check
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
