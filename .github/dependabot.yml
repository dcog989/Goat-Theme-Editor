version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      colordx:
        patterns:
          - '@colordx/*'
      biome:
        patterns:
          - '@biomejs/*'
      tooling:
        patterns:
          - '@evilmartians/lefthook'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
